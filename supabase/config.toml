# Polar calls this endpoint with a Standard Webhooks signature and NO Supabase JWT. Leaving the
# gateway's JWT check on makes every billing event bounce with 401 before the function runs, so
# subscriptions silently stop provisioning. The function is not unauthenticated as a result: it
# verifies the Standard Webhooks signature itself with POLAR_WEBHOOK_SECRET and returns 403 on
# anything unsigned or badly signed.
#
# This is declared here rather than passed as `--deploy --no-verify-jwt` because the flag has to
# be remembered on every single deploy, and forgetting it once takes billing down without any
# visible error. It has already happened (2026-08-04).
[functions.polar-webhook]
verify_jwt = false

# The marketing site fetches live prices anonymously, before anyone has signed in, so this one
# must be reachable without a JWT too. It is read-only and returns nothing but public list
# prices. Broken the same way as polar-webhook on 2026-08-04 and caught by the same check.
[functions.polar-prices]
verify_jwt = false

# The analytics beacon is posted by every visitor's browser, and by the /pv edge proxy, neither
# of which has a Supabase JWT. It was originally deployed with `--no-verify-jwt` on the command
# line and never written down here, so the very next `supabase functions deploy pageview` put the
# gateway check back and every pageview started bouncing with 401 before the function ran. That
# is exactly the failure mode the two blocks above already describe: the flag belongs in this
# file, not in a command somebody has to remember. Caught on 2026-08-10, by a redeploy.
[functions.pageview]
verify_jwt = false

# The anchor service authenticates its own writers with an account key it hashes and checks
# itself, and its reads are deliberately public: an auditor holding a receipt must be able to
# check it without an account here and without the customer's permission. A Supabase JWT would
# defeat both halves, so the gateway check stays off for the same reason as the three above.
[functions.anchor]
verify_jwt = false


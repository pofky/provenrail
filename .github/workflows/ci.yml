name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows and macOS are here because a CLI breaks on them in ways Linux never shows:
    # path separators, the default console encoding (cp1252 refusing our output), and
    # SQLite file locking. Testing only ubuntu meant claiming cross-platform support we
    # had never once run.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[anchor,dev]" ruff
      - name: Lint
        run: ruff check src
      - name: Test
        run: python -m pytest -q -W ignore::DeprecationWarning
      - name: CLI smoke test
        # Closes the loop a real user follows, on the platform under test.
        #
        # Invoked as `python -m provenrail`, not `pr`: on Windows under Git Bash the `pr` on
        # PATH is GNU coreutils' paginator, which answers `pr --version` with "pr (GNU
        # coreutils) 8.32" and fails on `--pin`. That collision is worth knowing about and is
        # documented for users, but a smoke test should exercise our code, not PATH order.
        shell: bash
        run: |
          python -m provenrail --version
          python -m provenrail demo --out b.json --pin pin.json
          python -m provenrail verify b.json --pin pin.json
          python -m provenrail spend b.json
          python -m provenrail report b.json --md --out r.md
          test -s r.md
          python -m provenrail pack b.json --out p.zip
          test -s p.zip
      - name: The console script is installed and is ours
        # Separate step, and not on Windows, where Git Bash's coreutils legitimately wins.
        if: runner.os != 'Windows'
        shell: bash
        run: pr --version | grep -q '^provenrail '
